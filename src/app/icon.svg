<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lcg-body" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="lcg-glass" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Camera Housing -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lcg-body)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Viewfinder Corner Brackets -->
  <path d="M15 22V17C15 15.8954 15.8954 15 17 15H22" stroke="#E0F2FE" stroke-width="2.4" stroke-linecap="round" />
  <path d="M15 42V47C15 48.1046 15.8954 49 17 49H22" stroke="#E0F2FE" stroke-width="2.4" stroke-linecap="round" />
  <path d="M42 49H47C48.1046 49 49 48.1046 49 47V42" stroke="#E0F2FE" stroke-width="2.4" stroke-linecap="round" />
  <!-- Precision Camera Lens -->
  <circle cx="32" cy="32" r="12.5" stroke="#FFFFFF" stroke-width="2.6" />
  <circle cx="32" cy="32" r="8.2" fill="url(#lcg-glass)" />
  <circle cx="32" cy="32" r="3.4" fill="#0F172A" />
  <!-- Optical Glass Reflection -->
  <circle cx="29" cy="28.5" r="2.1" fill="#FFFFFF" fill-opacity="0.85" />
  <!-- Live Recording Beacon -->
  <circle cx="47.5" cy="16.5" r="7.5" fill="#EF4444" fill-opacity="0.28" />
  <circle cx="47.5" cy="16.5" r="4.8" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.8" />
</svg>
