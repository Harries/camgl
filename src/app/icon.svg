<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lcg-bg" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="lcg-lens" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lcg-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
  <!-- Globe / Camera Lens Outer Ring -->
  <circle cx="32" cy="32" r="16" stroke="url(#lcg-lens)" stroke-width="2.6" />
  <!-- Meridian & Equator -->
  <ellipse cx="32" cy="32" rx="7.5" ry="16" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2" />
  <path d="M16.5 32H47.5" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round" />
  <!-- Camera Aperture Center -->
  <circle cx="32" cy="32" r="4.2" fill="#FFFFFF" />
  <!-- Live Broadcast Dot -->
  <circle cx="48" cy="16" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.2" />
</svg>
